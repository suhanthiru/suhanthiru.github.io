<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suhanraj Thirumal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* Layout idea: one narrow text column, plain links, no cards. The home page widens to fit a timeline. */
:root {
  --bg: #fdfdfc;
  --fg: #1c1c1b;
  --muted: #6c6c68;
  --rule: #e4e4e0;
  --line: #c8c8c2;
  --link: #1d4fa3;
  --tag: #f0f0ec;
  --font: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --fg: #e8e8e4; --muted: #9a9a94; --rule: #2e2e2b; --line: #4a4a45; --link: #8fb4f0; --tag: #232321;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --fg: #e8e8e4; --muted: #9a9a94; --rule: #2e2e2b; --line: #4a4a45; --link: #8fb4f0; --tag: #232321;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 18px; line-height: 1.6;
}
.wrap { max-width: 680px; margin: 0 auto; padding: 48px 20px 96px; }
.wrap.wide { max-width: 980px; }
a { color: var(--link); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
img { max-width: 100%; display: block; }
header { margin-bottom: 40px; }
.name { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
.name a { color: inherit; text-decoration: none; }
nav { display: flex; gap: 20px; flex-wrap: wrap; font-size: 16px; }
nav a { color: var(--muted); text-decoration: none; }
nav a[aria-current="page"] { color: var(--fg); text-decoration: underline; text-underline-offset: 5px; }
nav a:hover { color: var(--fg); }
h1 { font-size: 28px; line-height: 1.25; letter-spacing: -0.015em; margin: 0 0 8px; text-wrap: balance; }
h2 { font-size: 20px; margin: 36px 0 8px; text-wrap: balance; }
p { margin: 0 0 1em; }
.meta { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.lede { margin-bottom: 32px; }
.empty { color: var(--muted); font-style: italic; padding: 18px 0; border-top: 1px solid var(--rule); }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 18px; }
button.plain { background: none; border: 0; padding: 0; font: inherit; color: var(--muted); cursor: pointer; }

/* Lists of links (home) */
ul.rows { list-style: none; margin: 0; padding: 0; }
.row { padding: 12px 0; border-top: 1px solid var(--rule); display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 16px; }
.row:last-child { border-bottom: 1px solid var(--rule); }
.row .meta { padding-top: 2px; }
.row a { overflow-wrap: anywhere; }

/* Home: about on the left, timeline on the right */
.home { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 64px; align-items: start; }
.home-main { min-width: 0; max-width: 640px; }
.tagline { color: var(--muted); font-size: 19px; margin: 0 0 24px; }
.who-head { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
.who-head .avatar { width: 64px; height: 64px; font-size: 20px; }
.tl-wrap { padding-top: 6px; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { position: relative; padding: 0 0 24px 28px; }
.tl li::before {
  content: ""; position: absolute; left: 0; top: 6px; width: 12px; height: 12px;
  border-radius: 50%; border: 2px solid var(--fg); background: var(--bg); z-index: 1;
}
.tl li::after { content: ""; position: absolute; left: 5px; top: 18px; bottom: -6px; width: 2px; background: var(--line); }
.tl li:last-child { padding-bottom: 0; }
.tl li:last-child::after { display: none; }
.tl li.now::before { background: var(--link); border-color: var(--link); box-shadow: 0 0 0 4px color-mix(in srgb, var(--link) 20%, transparent); }
.tl .when { display: block; font-size: 13px; line-height: 24px; letter-spacing: 0.03em; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl .t-title { font-weight: 600; font-size: 16px; line-height: 1.35; }
.tl .t-detail { color: var(--muted); font-size: 15px; line-height: 1.45; margin-top: 2px; }

/* Feed */
.post { padding: 18px 0; border-top: 1px solid var(--rule); }
.post:last-child { border-bottom: 1px solid var(--rule); }
.post .text { white-space: pre-wrap; margin: 4px 0 6px; overflow-wrap: anywhere; }
.post .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.post img { margin: 10px 0 4px; border-radius: 3px; max-height: 520px; width: auto; }
.src { font-family: var(--mono); font-size: 12px; background: var(--tag); padding: 1px 7px; border-radius: 3px; color: var(--muted); }
.filters { display: flex; gap: 14px; flex-wrap: wrap; font-size: 15px; margin-bottom: 18px; }
.filters button { background: none; border: 0; padding: 0; font: inherit; color: var(--muted); cursor: pointer; }
.filters button[aria-pressed="true"] { color: var(--fg); text-decoration: underline; text-underline-offset: 5px; }

/* Archive lists (projects, essays): text left, thumbnail right */
.archive { list-style: none; margin: 0; padding: 0; }
.archive li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; padding: 20px 0; border-top: 1px solid var(--rule); align-items: start; }
.archive li:last-child { border-bottom: 1px solid var(--rule); }
.archive .a-title { font-size: 20px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; }
.archive .a-title a { color: var(--fg); text-decoration: none; }
.archive .a-title a:hover { color: var(--link); }
.archive .a-sub { color: var(--muted); font-size: 16px; line-height: 1.45; margin-top: 4px; }
.archive .a-meta { font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
.archive .thumb { width: 128px; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 3px; background: var(--tag); }

/* Long-form */
.prose h2 { font-size: 24px; margin: 1.6em 0 0.5em; }
.prose blockquote { margin: 0 0 1em; padding-left: 18px; border-left: 3px solid var(--fg); font-style: italic; }
.prose ul, .prose ol { margin: 0 0 1em; padding-left: 24px; }
.prose li { margin-bottom: 0.3em; }
.prose pre { background: var(--tag); padding: 12px 14px; overflow-x: auto; font-family: var(--mono); font-size: 14px; line-height: 1.5; margin: 0 0 1em; }
.prose code { font-family: var(--mono); font-size: 0.85em; background: var(--tag); padding: 1px 4px; border-radius: 3px; }
.prose pre code { background: none; padding: 0; }
.prose hr { border: 0; text-align: center; margin: 2em 0; }
.prose hr::after { content: "* * *"; color: var(--muted); letter-spacing: 0.4em; }
figure { margin: 1.6em 0; }
figure img { width: 100%; border-radius: 3px; cursor: zoom-in; }
figcaption { font-size: 14px; color: var(--muted); margin-top: 8px; line-height: 1.45; text-align: center; }
.back { font-size: 15px; display: inline-block; margin-bottom: 24px; }

/* Essay: a Substack-style reading page */
.essay h1 { font-size: 38px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 12px; }
.essay .sub { font-size: 21px; line-height: 1.4; color: var(--muted); margin: 0 0 24px; text-wrap: pretty; }
.byline { display: flex; gap: 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-bottom: 36px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--tag); color: var(--muted); display: grid; place-items: center; font-size: 14px; font-weight: 600; flex: none; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.byline .who { font-size: 15px; font-weight: 600; line-height: 1.3; }
.byline .when { font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.byline .share { margin-left: auto; font-size: 14px; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 14px; color: var(--fg); }
.byline .share:hover { border-color: var(--fg); }
.essay .cover { margin: 0 0 36px; }
.essay .prose { font-size: 20px; line-height: 1.72; }
.essay .prose p { margin-bottom: 1.15em; }
.essay-end { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--rule); }
.essay-end .archive li { padding: 16px 0; }

dialog.lightbox { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 92vh; }
dialog.lightbox::backdrop { background: rgb(0 0 0 / 0.82); }
dialog.lightbox img { max-width: 96vw; max-height: 86vh; width: auto; margin: 0 auto; }
dialog.lightbox p { color: #ddd; font-size: 14px; text-align: center; margin: 10px 0 0; }

footer { margin-top: 72px; font-size: 14px; color: var(--muted); display: flex; gap: 8px 18px; flex-wrap: wrap; }
footer a { color: var(--muted); }

@media (max-width: 800px) {
  .home { grid-template-columns: 1fr; gap: 48px; }
}
@media (max-width: 480px) {
  body { font-size: 17px; }
  .wrap { padding-top: 32px; }
  .row { grid-template-columns: 1fr; }
  .archive .thumb { width: 84px; }
  .essay h1 { font-size: 30px; }
  .essay .sub { font-size: 18px; }
  .essay .prose { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <p class="name"><a href="#home" id="site-name"></a></p>
    <nav aria-label="Main">
      <a href="#home" data-nav="home">Who am I</a>
      <a href="#feed" data-nav="feed">Feed</a>
      <a href="#projects" data-nav="projects">Projects</a>
      <a href="#essays" data-nav="essays">Essays</a>
    </nav>
  </header>
  <main id="view"></main>
  <footer id="foot"></footer>
</div>
<dialog class="lightbox" id="lightbox"><img alt="" id="lb-img"><p id="lb-cap"></p></dialog>

<script>
/* Content lives in content.json and posts.json, published from /post/. */
let PROFILE = {}, LINKS = [], TIMELINE = [], POSTS = [], PROJECTS = [], ESSAYS = [], PHOTOS = {};
let loaded = false, loadFailed = false;

const PLATFORMS = {
  linkedin: "LinkedIn", x: "X", instagram: "Instagram", threads: "Threads", bluesky: "Bluesky",
  github: "GitHub", youtube: "YouTube", tiktok: "TikTok", substack: "Substack", website: "Website", other: "Note"
};
const label = (k) => PLATFORMS[k] || (k ? k.charAt(0).toUpperCase() + k.slice(1) : "Note");
const linkLabel = (k) => k === "other" ? "Link" : label(k);
const $ = (s, r = document) => r.querySelector(s);
const view = $("#view");

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
  return m ? `${MONTHS[+m[2] - 1]} ${+m[3]}, ${m[1]}` : (iso || "");
}
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
function safeImg(u) {
  if (!u) return "";
  if (/^data:image\/(png|jpe?g|webp|gif);base64,[a-z0-9+/=]+$/i.test(u)) return u;
  if (/^https?:\/\//i.test(u)) return u;
  if (/^(\.\/)?[\w\-]+(\/[\w\-.]+)*\.(png|jpe?g|webp|gif|avif|svg)$/i.test(u) && !u.includes("..")) return u;
  return "";
}
function photo(ref) {
  if (!ref) return null;
  const id = ref.startsWith("photo:") ? ref.slice(6) : ref;
  const p = PHOTOS[id];
  if (p) { const src = safeImg(p.src); return src ? { src, caption: p.caption || "" } : null; }
  const src = safeImg(ref);
  return src ? { src, caption: "" } : null;
}
function readTime(text) { return Math.max(1, Math.round((text || "").split(/\s+/).filter(Boolean).length / 230)); }
function initials(n) { return (n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(""); }
function avatar() {
  const p = photo(PROFILE.avatar);
  return el("span", { class: "avatar", "aria-hidden": "true" }, p ? el("img", { src: p.src, alt: "" }) : initials(PROFILE.name));
}

/* Small markdown renderer. HTML is escaped first, so content cannot inject markup. */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2">$1</a>');
  return s;
}
const IMG_LINE = /^!\[([^\]]*)\]\(([^)\s]+)\)\s*$/;
const BLOCK = /^(## |> |- |\d+\. |```|---\s*$|!\[)/;
function md(src) {
  const out = [];
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  let i = 0;
  while (i < lines.length) {
    const ln = lines[i];
    if (!ln.trim()) { i++; continue; }
    let m;
    if (ln.startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++;
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
    } else if ((m = IMG_LINE.exec(ln))) {
      const p = photo(m[2]); i++;
      if (p) {
        const cap = m[1] || p.caption;
        out.push(`<figure><img src="${esc(p.src)}" alt="${esc(cap)}" loading="lazy">${cap ? `<figcaption>${inline(cap)}</figcaption>` : ""}</figure>`);
      }
    } else if (/^---\s*$/.test(ln)) {
      out.push("<hr>"); i++;
    } else if (ln.startsWith("## ")) {
      out.push(`<h2>${inline(ln.slice(3))}</h2>`); i++;
    } else if (ln.startsWith("> ")) {
      const buf = [];
      while (i < lines.length && lines[i].startsWith("> ")) buf.push(lines[i++].slice(2));
      out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`);
    } else if (/^- /.test(ln)) {
      const buf = [];
      while (i < lines.length && /^- /.test(lines[i])) buf.push(`<li>${inline(lines[i++].slice(2))}</li>`);
      out.push(`<ul>${buf.join("")}</ul>`);
    } else if (/^\d+\. /.test(ln)) {
      const buf = [];
      while (i < lines.length && /^\d+\. /.test(lines[i])) buf.push(`<li>${inline(lines[i++].replace(/^\d+\. /, ""))}</li>`);
      out.push(`<ol>${buf.join("")}</ol>`);
    } else {
      const buf = [];
      while (i < lines.length && lines[i].trim() && !BLOCK.test(lines[i])) buf.push(lines[i++]);
      out.push(`<p>${inline(buf.join(" "))}</p>`);
    }
  }
  return out.join("\n");
}
function prose(src, cls = "prose") { return el("div", { class: cls, html: md(src) }); }
function photoRefs(src) { return new Set([...String(src || "").matchAll(/photo:([\w-]+)/g)].map(m => m[1])); }

const byDateDesc = (a, b) => (b.date || "").localeCompare(a.date || "");
const slugOf = (x) => x.slug || x.id;
const slugify = (t) => (t || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
function addSlugs(list) {
  const used = new Set();
  for (const x of list) { let s = slugify(x.title) || x.id, n = 2; const base = s; while (used.has(s)) s = `${base}-${n++}`; used.add(s); x.slug = s; }
  return list;
}
const findBy = (list, key) => list.find(x => x.slug === key) || list.find(x => x.id === key);

function renderHome() {
  const main = el("div", { class: "home-main" },
    el("div", { class: "who-head" }, PROFILE.avatar ? avatar() : null, el("h1", { text: "Who am I" })),
    PROFILE.tagline ? el("p", { class: "tagline", text: PROFILE.tagline }) : null,
    prose(PROFILE.about));
  const ul = el("ul", { class: "rows", style: "margin-top:28px" });
  for (const l of LINKS) {
    const url = safeUrl(l.url);
    const shown = l.handle ? (l.handle.startsWith("@") || l.platform === "website" || l.platform === "substack" ? l.handle : "@" + l.handle)
      : (url || "").replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
    ul.append(el("li", { class: "row" }, el("span", { class: "meta", text: linkLabel(l.platform) }),
      url ? el("a", { href: url, rel: "me noopener", text: shown }) : el("span", { text: shown })));
  }
  if (PROFILE.email) ul.append(el("li", { class: "row" }, el("span", { class: "meta", text: "Email" }), el("span", { text: PROFILE.email })));
  if (ul.children.length) main.append(ul);

  const root = el("div", { class: "home" }, main);
  if (TIMELINE.length) {
    const ol = el("ol", { class: "tl" });
    for (const t of TIMELINE) {
      ol.append(el("li", { class: t.current ? "now" : "" },
        t.when ? el("span", { class: "when", text: t.when }) : null,
        el("div", { class: "t-title", text: t.title || "" }),
        t.detail ? el("div", { class: "t-detail", text: t.detail }) : null));
    }
    root.append(el("aside", { class: "tl-wrap", "aria-label": "Timeline" }, el("h2", { class: "eyebrow", text: "Timeline" }), ol));
  }
  return root;
}

const state = { filter: "all" };
function renderFeed() {
  const root = el("div");
  root.append(el("h1", { text: "Feed" }));
  root.append(el("p", { class: "meta lede", text: "Short posts from around the web, in one place." }));
  const posts = [...POSTS].sort(byDateDesc);
  const sources = [...new Set(posts.map(p => p.source || "other"))];
  if (sources.length > 1) {
    const filters = el("div", { class: "filters", role: "group", "aria-label": "Filter by source" });
    for (const key of ["all", ...sources]) {
      filters.append(el("button", { type: "button", "aria-pressed": String(state.filter === key),
        onclick: () => { state.filter = key; render(); } }, key === "all" ? "All" : label(key)));
    }
    root.append(filters);
  }
  const list = posts.filter(p => state.filter === "all" || (p.source || "other") === state.filter);
  if (!list.length) root.append(el("p", { class: "empty", text: "No posts yet." }));
  for (const p of list) {
    const link = safeUrl(p.url);
    const img = photo(p.photo);
    root.append(el("article", { class: "post" },
      el("div", { class: "head" },
        el("span", { class: "meta", text: fmtDate(p.date) }),
        el("span", { class: "src", text: label(p.source || "other") }),
        link ? el("a", { class: "meta", href: link, text: "original" }) : null),
      el("div", { class: "text", text: p.text || "" }),
      img ? el("img", { src: img.src, alt: img.caption, loading: "lazy" }) : null));
  }
  return root;
}

function archiveItem(href, title, sub, meta, thumbRef) {
  const t = photo(thumbRef);
  return el("li", {},
    el("div", {},
      el("div", { class: "a-title" }, el("a", { href, text: title || "Untitled" })),
      sub ? el("div", { class: "a-sub", text: sub }) : null,
      meta ? el("div", { class: "a-meta", text: meta }) : null),
    t ? el("a", { href, tabindex: "-1", "aria-hidden": "true" }, el("img", { class: "thumb", src: t.src, alt: "", loading: "lazy" })) : el("span"));
}

function renderProjects() {
  const root = el("div");
  root.append(el("h1", { text: "Projects" }));
  root.append(el("p", { class: "meta lede", text: "Longer work, with write-ups." }));
  if (!PROJECTS.length) { root.append(el("p", { class: "empty", text: "No projects yet." })); return root; }
  const ul = el("ul", { class: "archive" });
  for (const p of PROJECTS) {
    ul.append(archiveItem("#project-" + slugOf(p), p.title, p.blurb, [p.year, ...(p.tags || [])].filter(Boolean).join("  ·  "), (p.photos || [])[0]));
  }
  root.append(ul);
  return root;
}
function renderProject(slug) {
  const p = findBy(PROJECTS, slug);
  if (!p) return renderMissing();
  const photos = p.photos || [];
  const used = photoRefs(p.body);
  const cover = photos[0] && !used.has(photos[0]) ? photo(photos[0]) : null;
  const root = el("article");
  root.append(el("a", { class: "back", href: "#projects", text: "← Projects" }));
  root.append(el("h1", { text: p.title || "Untitled" }));
  root.append(el("div", { class: "meta", text: [p.year, ...(p.tags || [])].filter(Boolean).join("  ·  ") }));
  if (p.blurb || safeUrl(p.url)) {
    root.append(el("p", { class: "lede", style: "margin-top:12px" }, p.blurb || "",
      safeUrl(p.url) ? [p.blurb ? " " : "", el("a", { href: p.url, text: "Visit the project" })] : null));
  }
  if (cover) root.append(el("figure", {}, el("img", { src: cover.src, alt: cover.caption }), cover.caption ? el("figcaption", { text: cover.caption }) : null));
  root.append(prose(p.body));
  const rest = photos.filter((id, i) => !used.has(id) && !(i === 0 && cover)).map(photo).filter(Boolean);
  if (rest.length) {
    root.append(el("h2", { text: "Photos" }));
    const g = el("div", { style: "display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px" });
    for (const r of rest) g.append(el("figure", { style: "margin:0" }, el("img", { src: r.src, alt: r.caption, loading: "lazy", style: "aspect-ratio:4/3;object-fit:cover" }), r.caption ? el("figcaption", { text: r.caption, style: "text-align:left" }) : null));
    root.append(g);
  }
  return root;
}

function renderEssays() {
  const root = el("div");
  root.append(el("h1", { text: "Essays" }));
  root.append(el("p", { class: "meta lede", text: "Longer writing." }));
  if (!ESSAYS.length) { root.append(el("p", { class: "empty", text: "No essays yet." })); return root; }
  const ul = el("ul", { class: "archive" });
  for (const e of [...ESSAYS].sort(byDateDesc)) {
    ul.append(archiveItem("#essay-" + slugOf(e), e.title, e.subtitle, [fmtDate(e.date), readTime(e.body) + " min read"].filter(Boolean).join("  ·  "), e.cover));
  }
  root.append(ul);
  return root;
}
function renderEssay(slug) {
  const e = findBy(ESSAYS, slug);
  if (!e) return renderMissing();
  const cover = photo(e.cover);
  const share = el("button", { type: "button", class: "plain share", onclick: async () => {
    try { await navigator.clipboard.writeText(location.href); share.textContent = "Link copied"; }
    catch (err) { share.textContent = "Copy the address bar"; }
  }}, "Share");
  const root = el("article", { class: "essay" },
    el("a", { class: "back", href: "#essays", text: "← Essays" }),
    el("h1", { text: e.title || "Untitled" }),
    e.subtitle ? el("p", { class: "sub", text: e.subtitle }) : null,
    el("div", { class: "byline" }, avatar(),
      el("div", {}, el("div", { class: "who", text: PROFILE.name || "" }),
        el("div", { class: "when", text: [fmtDate(e.date), readTime(e.body) + " min read"].filter(Boolean).join("  ·  ") })),
      share),
    cover ? el("figure", { class: "cover" }, el("img", { src: cover.src, alt: cover.caption }), cover.caption ? el("figcaption", { text: cover.caption }) : null) : null,
    prose(e.body));
  const more = [...ESSAYS].sort(byDateDesc).filter(x => x !== e).slice(0, 3);
  if (more.length) {
    const ul = el("ul", { class: "archive" });
    for (const m of more) ul.append(archiveItem("#essay-" + slugOf(m), m.title, m.subtitle, fmtDate(m.date), m.cover));
    root.append(el("section", { class: "essay-end" }, el("h2", { class: "eyebrow", text: "More essays" }), ul));
  }
  return root;
}
function renderMissing() {
  return el("div", {}, el("h1", { text: "Not found" }), el("p", {}, el("a", { href: "#home", text: "Back home" })));
}

function route() {
  const h = (location.hash || "#" + (window.SITE_START || "home")).slice(1);
  if (h.startsWith("project-")) return { nav: "projects", node: renderProject(h.slice(8)) };
  if (h.startsWith("essay-")) return { nav: "essays", node: renderEssay(h.slice(6)) };
  if (h === "projects") return { nav: "projects", node: renderProjects() };
  if (h === "essays") return { nav: "essays", node: renderEssays() };
  if (h === "feed") return { nav: "feed", node: renderFeed() };
  return { nav: "home", node: renderHome() };
}
function render() {
  if (!loaded) { view.replaceChildren(loadFailed ? el("p", { class: "empty", text: "This page couldn't load. Refresh to try again." }) : ""); return; }
  const r = route();
  $("#wrap").classList.toggle("wide", r.nav === "home");
  view.replaceChildren(r.node);
  document.querySelectorAll("nav a").forEach(a => {
    if (a.dataset.nav === r.nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  const h1 = view.querySelector("h1");
  document.title = r.nav === "home" ? (PROFILE.name || "") : `${h1 ? h1.textContent : ""} · ${PROFILE.name || ""}`;
}
view.addEventListener("click", (ev) => {
  const img = ev.target.closest("figure img");
  if (!img) return;
  const lb = $("#lightbox");
  if (!lb.showModal) return;
  $("#lb-img").src = img.src; $("#lb-cap").textContent = img.alt || "";
  lb.showModal();
});
$("#lightbox").addEventListener("click", () => $("#lightbox").close());
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); render(); });
function setData(c, posts) {
  c = c && typeof c === "object" ? c : {};
  PROFILE = c.profile || {};
  LINKS = c.links || [];
  TIMELINE = c.timeline || [];
  PROJECTS = addSlugs((c.projects || []).filter(x => x && !x.hidden));
  ESSAYS = addSlugs((c.essays || []).filter(x => x && !x.hidden).sort(byDateDesc));
  PHOTOS = c.photos || {};
  POSTS = (Array.isArray(posts) ? posts : []).filter(p => p && typeof p.text === "string");
  loaded = true;
  $("#site-name").textContent = PROFILE.name || "";
  const foot = $("#foot");
  foot.replaceChildren(el("span", { text: "© " + new Date().getFullYear() + " " + (PROFILE.name || "") }));
  for (const l of LINKS) if (safeUrl(l.url)) foot.append(el("a", { href: l.url, rel: "me noopener", text: linkLabel(l.platform) }));
  render();
}
/* The editor at /post/ shows unpublished changes by handing them to this page. */
window.__setSiteData = setData;
if (!/[?&]preview(=|&|$)/.test(location.search)) {
  Promise.all(["content.json", "posts.json"].map(f => fetch(f, { cache: "no-cache" }).then(r => r.ok ? r.json() : null)))
    .then(([c, posts]) => { if (!c) throw new Error("missing content"); setData(c, posts || []); })
    .catch(() => { loadFailed = true; render(); });
}
</script>
</body>
