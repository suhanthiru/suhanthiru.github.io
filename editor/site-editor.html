<title>Suhanraj Site Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
/* Layout: top bar, section rail on the left, editing pane in the middle, live site preview on the right. */
:root {
  --ground: #f2f2ef;
  --panel: #fdfdfc;
  --fg: #1c1c1b;
  --muted: #6a6a66;
  --rule: #e2e2dd;
  --line: #cacac4;
  --accent: #1d4fa3;
  --accent-soft: #e5ecf7;
  --tag: #ebebe6;
  --ok: #2f7a4b;
  --bad: #b3261e;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #111110; --panel: #1a1a19; --fg: #e8e8e4; --muted: #9b9b95; --rule: #2c2c29; --line: #45453f;
    --accent: #8fb4f0; --accent-soft: #1e293b; --tag: #262624; --ok: #74c995; --bad: #f08a82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #111110; --panel: #1a1a19; --fg: #e8e8e4; --muted: #9b9b95; --rule: #2c2c29; --line: #45453f;
  --accent: #8fb4f0; --accent-soft: #1e293b; --tag: #262624; --ok: #74c995; --bad: #f08a82;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--ground); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
button, input, textarea, select { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; flex-direction: column; line-height: 1.15; margin-right: 8px; }
.brand b { font-family: var(--serif); font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.brand span { font-size: 12px; color: var(--muted); }
.status { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.status[data-state="saved"]::before { background: var(--ok); }
.status[data-state="saving"]::before { background: var(--accent); }
.status[data-state="error"] { color: var(--bad); }
.status[data-state="error"]::before { background: var(--bad); }
.status[data-state="local"]::before { background: var(--muted); }
.spacer { flex: 1; }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--fg); color: var(--panel); border-color: var(--fg); }
.btn.primary:hover { opacity: 0.88; }
.btn.small { padding: 4px 10px; font-size: 13px; font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--panel); border-color: var(--bad); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.icon { border: 1px solid transparent; background: none; border-radius: 6px; width: 30px; height: 30px; cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; display: inline-grid; place-items: center; }
.icon:hover { border-color: var(--line); color: var(--fg); }
.icon:disabled { opacity: 0.3; cursor: default; border-color: transparent; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.shell { display: grid; grid-template-columns: 196px minmax(0, 1fr); align-items: start; }
.shell.split { grid-template-columns: 196px minmax(0, 1fr) minmax(0, 46%); }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 61px); display: flex; flex-direction: column; gap: 2px; padding-block: 20px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 8px; }
.rail button { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; background: none; border: 0; border-radius: 7px; padding: 8px 10px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14.5px; }
.rail button:hover { color: var(--fg); background: var(--tag); }
.rail button[aria-current="page"] { color: var(--fg); background: var(--panel); box-shadow: inset 0 0 0 1px var(--rule); }
.rail .count { font-weight: 400; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail .sep { height: 1px; background: var(--rule); margin: 8px 10px; }

.pane { min-width: 0; padding-block: 28px 120px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.pane-inner { max-width: 760px; display: flex; flex-direction: column; gap: 20px; }
.pane-head h1 { font-family: var(--serif); font-size: 28px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; margin: 0 0 4px; text-wrap: balance; }
.pane-head p { margin: 0; color: var(--muted); max-width: 62ch; }
.pane-head .row-actions { margin-top: 14px; }

.box { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.box h2 { font-size: 13px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin: 0; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.field small { color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
input[type="text"], input[type="url"], input[type="email"], input[type="date"], input:not([type]), textarea, select {
  width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 8px 11px; font-size: 15px; min-width: 0;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; line-height: 1.55; }
.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-size: 14px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 26px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-family: var(--serif); font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.loading { color: var(--muted); padding: 40px 0; }
.banner { border-radius: 8px; padding: 10px 14px; font-size: 14px; background: var(--tag); color: var(--fg); }
.banner.bad { background: color-mix(in srgb, var(--bad) 12%, var(--panel)); }

/* Markdown body editor */
.md { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); overflow: clip; }
.md:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.md-bar { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; padding: 5px 6px; border-bottom: 1px solid var(--rule); background: var(--ground); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 61px); z-index: 2; }
.md-bar button { background: none; border: 0; border-radius: 5px; padding: 4px 9px; cursor: pointer; font-size: 13.5px; color: var(--muted); }
.md-bar button:hover { background: var(--panel); color: var(--fg); }
.md-bar button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: inset 0 0 0 1px var(--rule); }
.md-bar .div { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.md textarea { border: 0; border-radius: 0; box-shadow: none !important; padding: 14px 16px; min-height: 180px; resize: none; overflow: hidden; display: block; }
.md textarea.serif { font-family: var(--serif); font-size: 19px; line-height: 1.7; padding: 18px 20px; }
.md-preview { padding: 16px 20px; min-height: 180px; }

/* Rendered markdown, matching the site */
.prose { font-family: var(--serif); font-size: 18px; line-height: 1.65; }
.prose.big { font-size: 20px; line-height: 1.72; }
.prose p { margin: 0 0 1em; }
.prose h2 { font-size: 23px; margin: 1.4em 0 0.5em; line-height: 1.25; }
.prose blockquote { margin: 0 0 1em; padding-left: 18px; border-left: 3px solid var(--fg); font-style: italic; }
.prose ul, .prose ol { margin: 0 0 1em; padding-left: 24px; }
.prose pre { background: var(--tag); padding: 12px 14px; overflow-x: auto; font-family: var(--mono); font-size: 14px; }
.prose code { font-family: var(--mono); font-size: 0.85em; background: var(--tag); padding: 1px 4px; border-radius: 3px; }
.prose a { color: var(--accent); }
.prose hr { border: 0; text-align: center; margin: 1.6em 0; }
.prose hr::after { content: "* * *"; color: var(--muted); letter-spacing: 0.4em; }
.prose figure { margin: 1.4em 0; }
.prose figure img { width: 100%; border-radius: 4px; }
.prose figcaption { text-align: center; color: var(--muted); font-size: 14px; margin-top: 6px; }

/* Avatar and photos */
.who-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
.avatar { width: 88px; height: 88px; border-radius: 50%; background: var(--tag); color: var(--muted); display: grid; place-items: center; font-family: var(--serif); font-size: 28px; font-weight: 600; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; background: none; width: 100%; }
.drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--rule); border-radius: 9px; overflow: hidden; background: var(--panel); display: flex; flex-direction: column; }
.tile .img { position: relative; aspect-ratio: 4 / 3; background: var(--tag); }
.tile .img img { width: 100%; height: 100%; object-fit: cover; }
.tile .badge { position: absolute; top: 8px; left: 8px; background: var(--fg); color: var(--panel); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; }
.tile .body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.tile .body input { font-size: 13.5px; padding: 5px 8px; }
.tile .tools { display: flex; gap: 2px; align-items: center; flex-wrap: wrap; }
.tile .tools .btn { margin-left: auto; }
.cover { position: relative; border-radius: 10px; overflow: hidden; }
.cover img { width: 100%; max-height: 360px; object-fit: cover; }
.cover .row-actions { position: absolute; right: 10px; bottom: 10px; }

/* Timeline editor: mirrors the dots and line on the site */
.tl-edit { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tl-edit > li { position: relative; padding: 0 0 16px 34px; }
.tl-edit > li::before { content: ""; position: absolute; left: 4px; top: 22px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--fg); background: var(--ground); box-sizing: border-box; z-index: 1; }
.tl-edit > li::after { content: ""; position: absolute; left: 10px; top: 36px; bottom: -22px; width: 2px; background: var(--line); }
.tl-edit > li:last-child::after { display: none; }
.tl-edit > li.now::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.tl-edit .box { gap: 10px; padding: 14px; }
.tl-top { display: grid; grid-template-columns: 160px minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.tl-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* Lists of items */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; }
.item.open { grid-template-columns: minmax(0, 1fr); border-color: var(--line); }
.item .meta { font-size: 12.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.item .t { font-family: var(--serif); font-weight: 700; font-size: 19px; line-height: 1.3; }
.item .s { color: var(--muted); }
.item .excerpt { white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; font-family: var(--serif); font-size: 16.5px; line-height: 1.55; margin-top: 4px; }
.item .thumb { width: 104px; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 6px; background: var(--tag); }
.item .side { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.item button.titlelink { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.item button.titlelink:hover .t { color: var(--accent); }
.chip { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0; text-transform: none; background: var(--tag); padding: 1px 7px; border-radius: 4px; color: var(--muted); }
.chip.off { background: color-mix(in srgb, var(--bad) 14%, var(--panel)); color: var(--bad); }
.social-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 10px; align-items: end; }

/* Essay composer */
.composer { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 26px clamp(16px, 4vw, 40px) 32px; display: flex; flex-direction: column; gap: 14px; }
.composer .cmp-title { font-family: var(--serif); font-size: 36px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; border: 0; padding: 0; background: none; box-shadow: none !important; }
.composer .cmp-sub { font-family: var(--serif); font-size: 21px; color: var(--muted); border: 0; padding: 0; background: none; box-shadow: none !important; }
.composer .byline { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.composer .byline .avatar { width: 38px; height: 38px; font-size: 14px; }
.composer .byline b { display: block; font-size: 14.5px; }
.composer .byline span { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.composer .md { border-color: transparent; }
.composer .md:focus-within { border-color: transparent; box-shadow: none; }
.composer .md textarea.serif { padding: 6px 0; }
.composer .md-preview { padding: 6px 0; }
.composer .md-bar { margin: 0 -6px; border: 1px solid var(--rule); border-radius: 8px; }
.cmp-meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; justify-content: space-between; }
.cmp-meta .field { width: 170px; }

/* Preview pane */
.preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 61px); height: calc(100vh - 61px - env(safe-area-inset-top, 0px)); border-left: 1px solid var(--rule); background: var(--panel); display: flex; flex-direction: column; min-width: 0; }
.pv-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--muted); }
.pv-bar b { color: var(--fg); }
.preview iframe { flex: 1; width: 100%; border: 0; background: var(--panel); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--panel); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgb(0 0 0 / 0.18); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.steps code, .hint code { font-family: var(--mono); font-size: 13px; background: var(--tag); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
.stats { display: flex; gap: 24px; flex-wrap: wrap; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-family: var(--serif); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stats span { color: var(--muted); font-size: 13px; }

@media (max-width: 1180px) {
  .shell.split { grid-template-columns: 196px minmax(0, 1fr); }
  .preview { position: fixed; inset: calc(env(safe-area-inset-top, 0px) + 61px) 0 0 0; height: auto; z-index: 15; border-left: 0; }
}
@media (max-width: 860px) {
  .shell, .shell.split { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; flex-direction: row; overflow-x: auto; padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 4px; }
  .rail .sep { display: none; }
  .rail button { flex: none; }
  .pane { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 18px; }
  .md-bar { top: calc(env(safe-area-inset-top, 0px) + 100px); }
}
@media (max-width: 620px) {
  .grid2, .grid3, .social-row, .tl-top { grid-template-columns: minmax(0, 1fr); }
  .who-grid { grid-template-columns: minmax(0, 1fr); justify-items: start; }
  .item { grid-template-columns: minmax(0, 1fr); }
  .item .side { flex-direction: row; align-items: center; }
  .composer .cmp-title { font-size: 28px; }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="bar">
  <div class="brand"><b>Site Editor</b><span>suhanraj-website</span></div>
  <span class="status" id="status" data-state="loading" role="status">Loading</span>
  <span class="spacer"></span>
  <button class="btn" id="pv-toggle" type="button" aria-pressed="false">Preview</button>
  <button class="btn primary" id="dl-top" type="button">Download site</button>
</header>
<div class="shell" id="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main class="pane" id="pane"><div class="pane-inner"><p class="loading">Loading your content…</p></div></main>
  <aside class="preview" id="preview" hidden aria-label="Site preview">
    <div class="pv-bar"><span>Previewing <b id="pv-where">Who am I</b></span><span class="spacer"></span><button class="btn small" type="button" id="pv-close">Close</button></div>
    <iframe id="pv" title="Site preview" sandbox="allow-scripts allow-same-origin"></iframe>
  </aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const TEMPLATE = "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Suhanraj Thirumal\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap\">\n\u003cstyle>\n/* Layout idea: one narrow text column, plain links, no cards. The home page widens to fit a timeline. */\n:root {\n  --bg: #fdfdfc;\n  --fg: #1c1c1b;\n  --muted: #6c6c68;\n  --rule: #e4e4e0;\n  --line: #c8c8c2;\n  --link: #1d4fa3;\n  --tag: #f0f0ec;\n  --font: \"Source Serif 4\", Georgia, \"Times New Roman\", serif;\n  --mono: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --bg: #161615; --fg: #e8e8e4; --muted: #9a9a94; --rule: #2e2e2b; --line: #4a4a45; --link: #8fb4f0; --tag: #232321;\n    color-scheme: dark;\n  }\n}\n:root[data-theme=\"dark\"] {\n  --bg: #161615; --fg: #e8e8e4; --muted: #9a9a94; --rule: #2e2e2b; --line: #4a4a45; --link: #8fb4f0; --tag: #232321;\n  color-scheme: dark;\n}\n* { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; }\nbody {\n  margin: 0; background: var(--bg); color: var(--fg);\n  font-family: var(--font); font-size: 18px; line-height: 1.6;\n}\n.wrap { max-width: 680px; margin: 0 auto; padding: 48px 20px 96px; }\n.wrap.wide { max-width: 980px; }\na { color: var(--link); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }\na:hover { text-decoration-thickness: 2px; }\na:focus-visible, button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }\nimg { max-width: 100%; display: block; }\nheader { margin-bottom: 40px; }\n function detectSource(url) {

  if (/(^|\/\/|\.)(x|twitter)\.com/.test(u)) return "x";
  if (u.includes("instagram.com")) return "instagram";
  if (u.includes("threads.net") || u.includes("threads.com")) return "threads";
  if (u.includes("bsky.app")) return "bluesky";
  if (u.includes("youtube.com") || u.includes("youtu.be")) return "youtube";

function autoUrl(platform, handle) {

function photoSrc(ref) {

    if (ln.startsWith("```")) { const b = []; i++; while (i < lines.length && !lines[i].startsWith("```")) b.push(lines[i++]); i++; out.push(`<pre><code>${esc(b.join("\n"))}</code></pre>`); }

  const fire = () => { obj[key] = ta.value; grow(ta); onChange(); };

  const sel = () => [ta.selectionStart, ta.selectionEnd];

    el("button", { type: "button", title: "Italic", style: "font-style:italic;font-family:var(--serif)", onclick: () => wrap("*", "*", "italic text") }, "I"),
    el("button", { type: "button", title: "Quote", onclick: () => prefix("> ") }, "Quote"),
    el("button", { type: "button", title: "Bulleted list", onclick: () => prefix("- ") }, "List"),
    el("button", { type: "button", title: "Link", onclick: () => {
      const [s, e] = sel(); const t = ta.value.slice(s, e) || "link text"; const ins = `[${t}](https://)`;

function buildContent(extraId) {
  const visible = (x) => !x.hidden || x.id === extraId;
  const uniq = new Set();
  const slug = (x, fallback) => { let s = slugify(x.title) || fallback; let n = 2; const base = s; while (uniq.has(s)) s = `${base}-${n++}`; uniq.add(s); return s; };
  const posts = []; // feed posts live in posts.json, published from /post/
  uniq.clear();
  const projects = Object.values(S.projects).filter(visible).sort(byOrder)
    .map(p => ({ id: p.id, slug: slug(p, p.id), title: p.title || "Untitled", year: p.year || "", blurb: p.blurb || "", tags: (p.tags || []).filter(Boolean), url: (p.url || "").trim(), body: p.body || "", photos: (p.photos || []).filter(id => S.photos[id]) }));
  uniq.clear();
  const essays = Object.values(S.essays).filter(visible).sort(byDateDesc)
    .map(e => ({ id: e.id, slug: slug(e, e.id), title: e.title || "Untitled", subtitle: e.subtitle || "", date: e.date || "", cover: e.cover || "", body: e.body || "" }));
  const used = new Set([S.profile.avatar, ...posts.map(p => p.photo), ...projects.flatMap(p => [...p.photos, ...photoRefs(p.body)]), ...essays.flatMap(e => [e.cover, ...photoRefs(e.body)]), ...photoRefs(S.profile.about)].filter(Boolean));
  const photos = {};
  for (const id of used) if (S.photos[id]) photos[id] = { src: S.photos[id].src, caption: S.photos[id].caption || "" };
  return {
    profile: { name: S.profile.name || "", tagline: S.profile.tagline || "", about: S.profile.about || "", email: (S.profile.email || "").trim(), avatar: S.photos[S.profile.avatar] ? S.profile.avatar : "" },
    links: S.links.filter(l => (l.url || l.handle)).map(l => ({ platform: l.platform || "other", handle: (l.handle || "").trim(), url: (l.url || autoUrl(l.platform, l.handle)).trim() })),
    timeline: S.timeline.filter(t => t.title || t.when).map(t => ({ when: t.when || "", title: t.title || "", detail: t.detail || "", current: !!t.current })),
    posts, projects, essays, photos
  };
}
function buildHtml(start) {
  const content = buildContent(start && start.id);
  const json = JSON.stringify(content).replace(/</g, "\\u003c");
  let html = TEMPLATE.replace("__SITE_CONTENT__", () => json);
  if (start) {
    let hash = start.page;
    if (start.kind === "project") { const p = content.projects.find(x => x.id === start.id); hash = p ? "project-" + p.slug : "projects"; }
    if (start.kind === "essay") { const e = content.essays.find(x => x.id === start.id); hash = e ? "essay-" + e.slug : "essays"; }
    const tag = '<script type="application/json" id="site-content">';
    html = html.replace(tag, () => "<script>window.SITE_START=" + JSON.stringify(hash) + ";<\/script>" + tag);
  }
  return html;
}
function previewStart() {
  const d = ui.detail;
  if (ui.section === "projects") return d ? { kind: "project", id: d.id } : { page: "projects" };
  if (ui.section === "essays") return d ? { kind: "essay", id: d.id } : { page: "essays" };
  if (ui.section === "feed") return { page: "feed" };

}

function projectDetail(p) {

function paneEssays() {

  };
  const out = [head("Essays", "Long-form writing with a title, subtitle, optional cover image and reading time, laid out like a newsletter post.", el("button", { type: "button", class: "btn primary", text: "New essay", onclick: add }))];

        el("div", { class: "meta" }, fmtDate(e.date), `· ${readTime(e.body)} min read`, `· ${words(e.body).toLocaleString()} words`, e.hidden ? el("span", { class: "chip off", text: "Hidden from site" }) : null),

function essayDetail(e) {

  const updStats = () => { stats.textContent = `${words(e.body).toLocaleString()} words · ${readTime(e.body)} min read`; };
  updStats();
  const bylineWhen = el("span", { text: `${fmtDate(e.date)} · ${readTime(e.body)} min read` });
  const save = () => { persist("essays/" + e.id, e); updStats(); bylineWhen.textContent = `${fmtDate(e.date)} · ${readTime(e.body)} min read`; changed(); };
  const coverPh = e.cover && photoSrc(e.cover);

    ? el("div", { class: "cover" }, el("img", { src: coverPh.src, alt: "" }),
        el("div", { class: "row-actions" },

          el("button", { type: "button", class: "btn small", text: "Remove", onclick: () => { e.cover = ""; save(); gcPhotos(); renderPane(); } })))
    : dropZone("Add a cover image (optional)", (ids) => { e.cover = ids[0]; save(); gcPhotos(); renderPane(); });
  const title = el("input", { type: "text", id: "es-title", class: "cmp-title", value: e.title || "", placeholder: "Title", "aria-label": "Title" });
  title.addEventListener("input", () => { e.title = title.value; save(); });

  sub.addEventListener("input", () => { e.subtitle = sub.value; save(); });
  return [
    el("div", { class: "row-actions" },
      el("button", { type: "button", class: "linkish", text: "← All essays", onclick: () => { ui.detail = null; renderPane(); refreshPreview(true); } }),
      el("span", { class: "spacer" }), stats),
    el("article", { class: "composer" },
      el("div", { class: "cmp-meta" },
        field("Publish date", text(e, "date", save, { id: "es-date", type: "date" })),
        checkbox({ v: !e.hidden }, "v", "Show on site", (v) => { e.hidden = !v; save(); }, "es-visible")),
      cover, title, sub,
      el("div", { class: "byline" }, avatarEl(), el("div", {}, el("b", { text: S.profile.name || "Your name" }), bylineWhen)),
      bodyEditor(e, "body", save, { id: "es-body", label: "Essay", serif: true, placeholder: "Start writing…" }),
      el("p", { class: "hint", text: MD_HINT + " Use Heading for section titles and Break for a * * * divider." })),
    el("div", { class: "row-actions" }, el("span", { class: "spacer" }),
      deleteBtn("Delete essay", () => { delete S.essays[e.id]; persist("essays/" + e.id, null, 0); ui.detail = null; gcPhotos(); changed(); renderPane(); }))
  ];
}

function panePublish() {
  const c = buildContent();
  const html = buildHtml();
  const mb = new Blob([html]).size / 1048576;
  const out = [head("Publish", "Your edits save here automatically. To update the live site, download a fresh index.html and put it in your site folder.")];
  out.push(el("section", { class: "box" },
    el("div", { class: "stats" },
      el("div", {}, el("b", { text: c.projects.length }), el("span", { text: "projects" })),
      el("div", {}, el("b", { text: c.essays.length }), el("span", { text: "essays" })),
      el("div", {}, el("b", { text: Object.keys(c.photos).length }), el("span", { text: "photos" })),
      el("div", {}, el("b", { text: mb < 0.1 ? "<0.1" : mb.toFixed(1) }), el("span", { text: "MB file" }))),
    el("ol", { class: "steps" },
      el("li", {}, "Download the new ", el("code", { text: "index.html" }), "."),
      el("li", {}, "Replace ", el("code", { text: "D:\\suhanraj-website\\index.html" }), " with it."),
      el("li", {}, "Commit and push, or ask Claude to do it for you.")),
    el("div", { class: "row-actions" }, el("button", { type: "button", class: "btn primary", text: "Download index.html", onclick: downloadSite }),
      mode === "local" ? el("span", { class: "hint", text: "Edits are only kept in this browser." }) : null)));
  if (ui.fallbackHtml) {
    const ta = el("textarea", { id: "fallback-html", readonly: true, rows: 6, style: "font-family:var(--mono);font-size:12px" }); ta.value = ui.fallbackHtml;
    out.push(el("section", { class: "box" }, el("h2", { text: "Copy instead" }),
      el("p", { class: "hint", text: "Downloads aren't available in this view. Copy all of this and paste it over the contents of index.html." }), ta,
      el("div", { class: "row-actions" }, el("button", { type: "button", class: "btn", text: "Copy HTML", onclick: async () => {
        try { await navigator.clipboard.writeText(ui.fallbackHtml); toast("Copied"); } catch (e) { ta.select(); toast("Press Ctrl+C to copy the selected text"); }
      } }))));
  }
  const file = el("input", { type: "file", id: "import-file", accept: ".html,text/html" });
  let armed = false;
  const importBtn = el("button", { type: "button", class: "btn danger", text: "Replace editor content with this file" });
  importBtn.disabled = true;
  file.addEventListener("change", () => { importBtn.disabled = !file.files.length; });
  importBtn.addEventListener("click", async () => {
    if (!armed) { armed = true; importBtn.classList.add("armed"); importBtn.textContent = "Click again: this replaces everything here"; return; }
    await importSite(file.files[0]);
  });
  out.push(el("section", { class: "box" }, el("h2", { text: "Start from a site file" }),
    el("p", { class: "hint", text: "Load the content of an index.html made by this editor. Everything currently in the editor is replaced." }),
    file, el("div", { class: "row-actions" }, importBtn)));
  return out;
}
async function importSite(f) {
  if (!f) return;
  let c;
  try {
    const m = /<script type="application\/json" id="site-content">([\s\S]*?)<\/script>/.exec(await f.text());
    if (!m) throw new Error("block");
    c = JSON.parse(m[1]);
  } catch (e) { toast("That file has no site content block. Pick an index.html made by this editor."); return; }
  const next = { profile: { name: "", tagline: "", about: "", email: "", avatar: "", ...(c.profile || {}) }, links: [], timeline: [], posts: {}, projects: {}, essays: {}, photos: {} };
  next.links = (c.links || []).map(l => ({ platform: l.platform || "other", handle: l.handle || "", url: l.url || "", urlAuto: false }));
  next.timeline = (c.timeline || []).map(t => ({ when: t.when || "", title: t.title || "", detail: t.detail || "", current: !!t.current }));
  for (const p of c.posts || []) { const id = p.id || newId(); next.posts[id] = { ...p, id }; }
  (c.projects || []).forEach((p, i) => { const id = p.id || newId(); next.projects[id] = { ...p, id, order: i, tags: p.tags || [], photos: p.photos || [], hidden: false }; });
  for (const e of c.essays || []) { const id = e.id || newId(); next.essays[id] = { ...e, id, hidden: false }; }
  for (const [id, ph] of Object.entries(c.photos || {})) if (ph && ph.src) next.photos[id] = { src: ph.src, caption: ph.caption || "" };
  if (mode === "db") {
    const ops = [];
    for (const kind of ["posts", "projects", "essays", "photos"]) {
      for (const id of Object.keys(S[kind])) if (!next[kind][id]) ops.push([kind + "/" + id, null]);
      for (const [id, v] of Object.entries(next[kind])) ops.push([kind + "/" + id, v]);
    }
    ops.push(["site/profile", next.profile], ["site/links", { items: next.links }], ["site/timeline", { items: next.timeline }]);
    setStatus("saving", `Importing 0 of ${ops.length}`);
    try {
      let n = 0;
      for (const [path, data] of ops) {
        if (data === null) await db.doc(path).delete(); else await db.doc(path).set(data);
        setStatus("saving", `Importing ${++n} of ${ops.length}`);
      }
      setStatus("saved");
    } catch (e) { setStatus("error", "The import stopped partway. Try again."); toast("The import stopped partway. Try again."); }
  }
  Object.assign(S, next);
  if (mode === "local") scheduleLocal();
  ui.detail = null; ui.fallbackHtml = "";
  toast("Imported"); renderAll();
}

/* ---------- shell ---------- */
function counts() {
  return { timeline: S.timeline.length, social: S.links.length, projects: Object.keys(S.projects).length, essays: Object.keys(S.essays).length };
}
function renderRail() {
  const n = counts();
  const rail = $("#rail");
  rail.replaceChildren(...SECTIONS.flatMap(([k, l]) => [
    k === "publish" ? el("div", { class: "sep" }) : null,
    el("button", { type: "button", "aria-current": ui.section === k ? "page" : false, onclick: () => go(k) }, l, n[k] != null ? el("span", { class: "count", text: n[k] }) : null)
  ]).filter(Boolean));
}
function renderPane() {
  const inner = el("div", { class: "pane-inner" });
  if (ui.fatal) inner.append(el("div", { class: "banner bad", text: ui.fatal }));
  else if (!ui.loaded) inner.append(el("p", { class: "loading", id: "load-note", text: "Loading your content…" }));
  else {
    if (mode === "local") inner.append(el("div", { class: "banner", text: "Edits are saved in this browser only. Open this editor on claude.ai to keep them in your account." }));
    const fn = { who: paneWho, timeline: paneTimeline, social: paneSocial, feed: paneFeed, projects: paneProjects, essays: paneEssays, publish: panePublish }[ui.section];
    inner.append(...fn().filter(Boolean));
  }
  $("#pane").replaceChildren(inner);
}
function renderAll() { renderRail(); renderPane(); refreshPreview(true); }
function go(section) {
  if (!SECTIONS.some(s => s[0] === section)) section = "who";
  if (ui.section !== section) { ui.detail = null; ui.openPost = null; }
  ui.section = section;
  if (location.hash.slice(1) !== section) history.replaceState(null, "", "#" + section);
  renderAll();
  window.scrollTo(0, 0);
}
function setPreview(on) {
  ui.preview = on;
  $("#preview").hidden = !on;
  $("#shell").classList.toggle("split", on);
  $("#pv-toggle").setAttribute("aria-pressed", String(on));
  if (on) refreshPreview(true);
}
$("#pv-toggle").addEventListener("click", () => setPreview(!ui.preview));
$("#pv-close").addEventListener("click", () => setPreview(false));
$("#dl-top").addEventListener("click", downloadSite);
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== ui.section) go(h); });

/* ---------- boot ---------- */
function applyLoaded(p, l, t, posts, projects, essays, photos) {
  if (p.exists) Object.assign(S.profile, clone(p.data()));
  if (l.exists) S.links = clone(l.data().items || []);
  if (t.exists) S.timeline = clone(t.data().items || []);
  for (const d of posts.docs) S.posts[d.id] = { ...clone(d.data()), id: d.id };
  for (const d of projects.docs) S.projects[d.id] = { ...clone(d.data()), id: d.id };
  for (const d of essays.docs) S.essays[d.id] = { ...clone(d.data()), id: d.id };
  for (const d of photos.docs) S.photos[d.id] = clone(d.data());
}
async function loadFromDb() {
  const slow = setTimeout(() => { const n = $("#load-note"); if (n) n.textContent = "Still loading. Your saved content will appear as soon as the connection answers."; }, 10000);
  const read = () => Promise.all([
    db.doc("site/profile").get(), db.doc("site/links").get(), db.doc("site/timeline").get(),
    db.collection("posts").limit(1000).get(), db.collection("projects").limit(1000).get(),
    db.collection("essays").limit(1000).get(), db.collection("photos").limit(1000).get()
  ]);
  try {
    let res;
    try { res = await read(); }
    catch (e) { if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 1200)); res = await read(); } else throw e; }
    applyLoaded(...res);
    mode = "db"; setStatus("saved");
  } catch (e) {
    ui.fatal = "Your saved content couldn't be loaded, so editing is paused to keep it safe. Reload the page to try again.";
    setStatus("error", "Not loaded");
  } finally { clearTimeout(slow); }
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const v = JSON.parse(raw); for (const k of Object.keys(S)) if (v[k]) S[k] = v[k]; }
  } catch (e) {}
  mode = "local"; setStatus("local");
}
async function boot() {
  const h = location.hash.slice(1);
  if (SECTIONS.some(s => s[0] === h)) ui.section = h;
  renderRail(); renderPane();
  const use = (name) => (window.claude && window.claude.use) ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
  const [dbNs, dl] = await Promise.all([use("db"), use("downloads")]);
  downloads = dl;
  if (dbNs) { db = dbNs; await loadFromDb(); } else loadLocal();
  ui.loaded = !ui.fatal;
  renderAll();
}
boot();
